services:
 db:
  image: pgvector/pgvector:pg17
  container_name: firmrag-db
  restart: unless-stopped
  environment:
   POSTGRES_USER: firmrag
   POSTGRES_PASSWORD: firmrag_dev
   POSTGRES_DB: firmrag
  ports:
   - "5433:5432"
  volumes:
   - pgdata:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U firmrag -d firmrag"]
   interval: 5s
   timeout: 5s
   retries: 10

 app:
  build: .
  container_name: firmrag-app
  restart: unless-stopped
  ports:
    - "3000:3000"
  environment:
    DATABASE_URL: postgresql://firmrag:firmrag_dev@db:5432/firmrag
    OLLAMA_URL: http://host.docker.internal:11434
    EMBED_MODEL: nomic-embed-text
    CHAT_MODEL: qwen2.5:7b
    # Read from .env, which is gitignored. This gate protects a publicly
    # reachable tunnel URL, so the value must never be committed.
    DEMO_USER: ${DEMO_USER}
    DEMO_PASSWORD: ${DEMO_PASSWORD}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy

volumes:
  pgdata:
